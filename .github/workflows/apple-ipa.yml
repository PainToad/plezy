name: App release builds

on:
  push:
    tags: ['**']

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"

  TRUSTED_BUILD_CACHE_VERSION: tagged-build-v1
  RELEASE_DART_DEFINES: --dart-define=GIT_COMMIT=${{ github.sha }}
  LINUX_APT_PACKAGES: >
    clang cmake meson ninja-build pkg-config nasm libgtk-3-dev libevdev-dev liblzma-dev libstdc++-12-dev libasound2-dev libass-dev libfreetype-dev libfontconfig-dev libfribidi-dev libharfbuzz-dev libepoxy-dev libegl-dev libgl-dev libgnutls28-dev libpipewire-0.3-dev libva-dev libvdpau-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxpresent-dev libxkbcommon-dev libpulse-dev libdbus-1-dev libdrm-dev libdisplay-info-dev libgbm-dev libwayland-dev wayland-protocols liblcms2-dev libmujs-dev liblua5.2-dev ruby ruby-dev rubygems build-essential rpm libarchive-tools imagemagick libcurl4-openssl-dev zsync desktop-file-utils

jobs:
  playback-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false
      - run: flutter pub get --enforce-lockfile --no-example
      - name: Verify Dart formatting
        run: |
          find lib test -name '*.dart' ! -name '*.g.dart' ! -name '*.freezed.dart' -type f -print0 |
            xargs -0 -r dart format
          git diff --exit-code -- lib test
      - name: Verify live playback opens and time-shift sessions
        run: >-
          flutter test test/mpv/player_open_test.dart
          test/screens/video_player/live_media_session_test.dart
          test/screens/video_player/live_tv_session_state_test.dart
          test/screens/livetv/live_tv_screen_test.dart
          test/screens/livetv/guide_tab_test.dart
          test/screens/livetv/guide_search_sheet_test.dart
          test/screens/livetv/guide_recording_indicator_test.dart
          test/screens/libraries/libraries_screen_test.dart
          test/screens/libraries/library_browse_tab_test.dart
          test/screens/libraries/library_browse_music_test.dart
          test/screens/discover_screen_test.dart
          test/utils/home_sections_test.dart
          test/navigation/profile_session_screen_test.dart
          test/screens/profile/profile_teardown_test.dart
          test/services/music/music_playback_service_test.dart
          test/widgets/media_context_menu_test.dart

  build:
    name: Unsigned ${{ matrix.platform }} IPA
    needs: playback-tests
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            app_directory: build/ios/iphoneos
          - platform: tvos
            app_directory: build/tvos/Build/Products/Release-appletvos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false
      - name: Install locked Dart dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Build iPhone and iPad app
        if: matrix.platform == 'ios'
        run: >-
          flutter build ios --release --no-codesign --no-pub
          --dart-define=GIT_COMMIT=${{ github.sha }}
          --split-debug-info=debug-info/ios

      - name: Fetch verified tvOS Flutter engine
        if: matrix.platform == 'tvos'
        run: tvos/scripts/fetch_engine.sh
      - name: Install tvOS pods and wire native plugins
        if: matrix.platform == 'tvos'
        run: |
          tvos/scripts/pod_install.sh
          ruby tvos/scripts/wire_mpv.rb
          ruby tvos/scripts/wire_plugins.rb
          ruby tvos/scripts/wire_top_shelf.rb
          ruby tvos/scripts/test_wire_mpv.rb
          ruby tvos/scripts/test_wire_top_shelf.rb
      - name: Build Apple TV app
        if: matrix.platform == 'tvos'
        run: |
          xcodebuild build \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build/tvos \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned IPA
        env:
          APP_DIRECTORY: ${{ matrix.app_directory }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          apps=("$APP_DIRECTORY"/*.app)
          if [[ ${#apps[@]} -ne 1 || ! -d "${apps[0]}" ]]; then
            echo "::error::Expected exactly one built app in $APP_DIRECTORY"
            exit 1
          fi
          mkdir -p "build/ipa-$PLATFORM/Payload" artifacts
          ditto "${apps[0]}" "build/ipa-$PLATFORM/Payload/$(basename "${apps[0]}")"
          ipa="$GITHUB_WORKSPACE/artifacts/plezy-$PLATFORM-unsigned.ipa"
          (cd "build/ipa-$PLATFORM" && zip -qry "$ipa" Payload)
          unzip -tq "$ipa"
          echo "Unsigned IPA: sign with your sideloading tool before installing." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          archive: false
          path: artifacts/plezy-${{ matrix.platform }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS app
    needs: playback-tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false
      - name: Install locked Dart dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Build macOS app
        run: >-
          flutter build macos --release --no-pub
          --dart-define=GIT_COMMIT=${{ github.sha }}
          --split-debug-info=debug-info/macos
      - name: Sign locally and package DMG
        run: |
          set -euo pipefail
          apps=(build/macos/Build/Products/Release/*.app)
          if [[ ${#apps[@]} -ne 1 || ! -d "${apps[0]}" ]]; then
            echo "::error::Expected exactly one built macOS app"
            exit 1
          fi
          app="${apps[0]}"
          codesign --force --deep --sign - --entitlements macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p build/macos-dmg artifacts
          ditto "$app" "build/macos-dmg/$(basename "$app")"
          ln -s /Applications build/macos-dmg/Applications
          hdiutil create -format UDZO -srcfolder build/macos-dmg -volname "Plezy" artifacts/plezy-macos.dmg
          hdiutil verify artifacts/plezy-macos.dmg
          echo "macOS DMG: ad-hoc signed for local use; not Apple-notarized." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          archive: false
          path: artifacts/plezy-macos.dmg
          if-no-files-found: error
          retention-days: 14

  build-android-tv:
    needs: playback-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: '${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache: false
      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Configure APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            : "${STORE_PASSWORD:?Missing Android store password}"
            : "${KEY_PASSWORD:?Missing Android key password}"
            : "${KEY_ALIAS:?Missing Android key alias}"
          else
            keytool -genkeypair -noprompt -keystore android/app/upload-keystore.jks \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
            STORE_PASSWORD=android
            KEY_PASSWORD=android
            KEY_ALIAS=androiddebugkey
            echo 'Android APKs use a temporary development signing key. Configure ANDROID_KEYSTORE_BASE64 and signing secrets for updates across releases.' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Build APKs
        run: flutter build apk --release --split-per-abi ${{ env.RELEASE_DART_DEFINES }} --dart-define=SENTRY_DIST=github-android-apk --obfuscate --split-debug-info=debug-info/android-apk --extra-gen-snapshot-options=--save-obfuscation-map=debug-info/android-apk/obfuscation.map.json
      - name: Clean up APK signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
      - name: Name Android TV packages
        run: |
          mkdir -p artifacts
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "artifacts/plezy-android-tv-$abi.apk"
          done
      - name: Upload Android TV arm64-v8a
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: artifacts/plezy-android-tv-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android TV armeabi-v7a
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: artifacts/plezy-android-tv-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android TV x86_64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: artifacts/plezy-android-tv-x86_64.apk
          if-no-files-found: error
          retention-days: 14
    timeout-minutes: 90
    name: Android TV APKs
  build-windows:
    needs: playback-tests
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            flutter_setup: action
            native_cache_path: build/windows/x64/_deps
          - arch: arm64
            runner: windows-11-arm
            flutter_setup: git
            native_cache_path: build/windows/arm64/_deps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cache Windows native dependencies
        id: windows-native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ matrix.native_cache_path }}
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-windows-native-${{ matrix.arch }}-${{ hashFiles('windows/CMakeLists.txt', 'mpv-build.lock.json') }}
      - name: Setup Flutter
        if: matrix.flutter_setup == 'action'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: '${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache: false
      - name: Set up Flutter from its pinned commit
        if: matrix.flutter_setup == 'git'
        uses: ./.github/actions/setup-flutter-git
      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
      - name: Install dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile --no-example
      - name: Install patched Flutter engine (DComp)
        shell: pwsh
        run: |
          flutter precache --windows
          .\windows\tool\install-patched-engine.ps1
      - name: Build Windows ${{ matrix.arch }}
        shell: pwsh
        run: flutter build windows --release ${{ env.RELEASE_DART_DEFINES }} --dart-define=SENTRY_DIST=github-windows-${{ matrix.arch }} --split-debug-info=debug-info/windows-${{ matrix.arch }}
      - name: Verify Windows bundle contents
        shell: pwsh
        run: |
          $bundleDir = "build/windows/${{ matrix.arch }}/runner/Release"
          if (-not (Test-Path -LiteralPath $bundleDir -PathType Container)) {
            throw "Windows bundle directory does not exist: $bundleDir"
          }

          $bundlePath = (Resolve-Path -LiteralPath $bundleDir).Path
          $foundFiles = @(
            Get-ChildItem -LiteralPath $bundlePath -File -Recurse |
              ForEach-Object {
                $_.FullName.Substring($bundlePath.Length + 1).Replace('\', '/')
              } |
              Sort-Object
          )

          Write-Host "Files found in ${bundleDir}:"
          $foundFiles | ForEach-Object { Write-Host "  $_" }

          $requiredFiles = @(
            "plezy.exe"
            "flutter_windows.dll"
            "sqlite3.dll"
            "libmpv-2.dll"
            "data/app.so"
            "data/icudtl.dat"
            "data/flutter_assets/NativeAssetsManifest.json"
            # MSVC runtime bundled by InstallRequiredSystemLibraries in
            # windows/CMakeLists.txt; without it the app crashes at startup on
            # machines whose system-wide redist is older than the CI toolset.
            "msvcp140.dll"
            "vcruntime140.dll"
          )
          $forbiddenFiles = @(
            "plezy.lib"
            "plezy.exp"
            "simdutf.lib"
          )

          $bundleErrors = @()
          foreach ($file in $requiredFiles) {
            if ($foundFiles -notcontains $file) {
              Write-Output "::error::Required Windows bundle file is missing: $file"
              $bundleErrors += "missing $file"
            }
          }
          foreach ($file in $forbiddenFiles) {
            if ($foundFiles -contains $file) {
              Write-Output "::error::Forbidden link by-product is present in the Windows bundle: $file"
              $bundleErrors += "present $file"
            }
          }
          # Release links emit PDBs (windows/CMakeLists.txt) that
          # scripts/release/upload_symbols.dart uploads from the build tree;
          # none may ship in the bundle.
          foreach ($file in @($foundFiles | Where-Object { $_ -like '*.pdb' })) {
            Write-Output "::error::Forbidden debug file is present in the Windows bundle: $file"
            $bundleErrors += "present $file"
          }

          # sentry.dll is the inproc-backend native SDK; crashpad_handler.exe is
          # intentionally absent (windows/CMakeLists.txt sets
          # SENTRY_NATIVE_BACKEND=inproc), so do not assert on it here.

          if ($bundleErrors.Count -gt 0) {
            throw "Windows bundle verification failed: $($bundleErrors -join '; ')"
          }
      - name: Upload ${{ matrix.arch }} build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-${{ matrix.arch }}-build
          path: build/windows/${{ matrix.arch }}/runner/Release/
    timeout-minutes: 90
  package-windows:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: '${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache: false
      - name: Install dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile --no-example
      - name: Download x64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-x64-build
          path: build-x64
      - name: Download arm64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-arm64-build
          path: build-arm64
      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(python3 scripts/pubspec_version.py pubspec.yaml)
          echo "version=${VERSION%%+*}" >> "$GITHUB_OUTPUT"
      - name: Build installer and portables
        run: .\windows\build-installer.ps1 -X64BuildDir "build-x64" -Arm64BuildDir "build-arm64" -Version "${{ steps.version.outputs.version }}"
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: plezy-windows-installer.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows x64 portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: plezy-windows-x64-portable.7z
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows ARM64 portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: plezy-windows-arm64-portable.7z
          if-no-files-found: error
          retention-days: 14
    timeout-minutes: 90
  build-linux:
    needs: playback-tests
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            flutter_channel: stable
            pkg_config_arch: x86_64-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            flutter_channel: stable
            pkg_config_arch: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: ${{ matrix.flutter_channel }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: '${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache: false
      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: ${{ env.LINUX_APT_PACKAGES }}
          version: trusted-build-v1.1
      - name: Install Linux dependencies
        shell: bash
        run: |
          read -r -a packages <<< "$LINUX_APT_PACKAGES"

          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 "${packages[@]}"; then
              exit 0
            fi

            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sleep $((attempt * 15))
          done

          exit 1
      - name: Cache libmpv prefix
        id: libmpv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: libmpv-prefix
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-libmpv-${{ runner.arch }}-${{ hashFiles('mpv-build.lock.json') }}
      - name: Fetch libmpv
        if: steps.libmpv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          command -v zstd >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd; }
          python3 scripts/fetch_linux_libmpv.py --dest libmpv-prefix
      - name: Install fpm
        shell: bash
        run: sudo gem install fpm --version 1.17.0 --no-document
      - name: Install dependencies
        shell: bash
        run: flutter pub get --enforce-lockfile --no-example
      - name: Build Linux ${{ matrix.arch }}
        shell: bash
        run: flutter build linux --release ${{ env.RELEASE_DART_DEFINES }} --dart-define=SENTRY_DIST=github-linux-${{ matrix.arch }} --split-debug-info=debug-info/linux-${{ matrix.arch }}
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/libmpv-prefix/lib/pkgconfig:${{ github.workspace }}/libmpv-prefix/lib/${{ matrix.pkg_config_arch }}/pkgconfig
      - name: Resolve bundle directory
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            bundle_dir=build/linux/x64/release/bundle
          else
            bundle_dir=$(find build/linux -path "*/release/bundle" -type d | head -1)
          fi
          if [[ -z "$bundle_dir" || ! -d "$bundle_dir" ]]; then
            echo "ERROR: Linux bundle directory not found" >&2
            exit 1
          fi
          echo "BUNDLE_DIR=$bundle_dir" >> "$GITHUB_ENV"
      - name: Copy libmpv into bundle
        shell: bash
        run: |
          BUNDLE_LIB="$BUNDLE_DIR/lib"
          LIBMPV_DIR=$(dirname "$(find libmpv-prefix -name 'libmpv.so' | head -1)")
          cp -a "$LIBMPV_DIR"/libmpv.so* "$BUNDLE_LIB/"
          cp -a libmpv-prefix/lib/libshaderc_shared.so* "$BUNDLE_LIB/"
      - name: Bundle shared libraries
        shell: bash
        run: bash linux/packaging/bundle-libs.sh "$BUNDLE_DIR"
      - name: Copy wrapper script into bundle
        shell: bash
        run: cp linux/packaging/plezy.sh "$BUNDLE_DIR/plezy.sh"
      - name: Verify every unbundled library the bundle needs is declared
        shell: bash
        run: python3 linux/packaging/check-bundle-host-deps.py "$BUNDLE_DIR"
      - name: Build Linux Packages
        shell: bash
        run: |
          BUILD_DIR="$BUNDLE_DIR" \
          ARCH_SUFFIX=${{ matrix.arch }} \
          OUTPUT_DIR="$GITHUB_WORKSPACE" \
          PLEZY_SKIP_HOST_DEP_CHECK=1 \
          python3 linux/packaging/build-packages.py
      - name: Verify the declared dependencies reached the package metadata
        shell: bash
        run: python3 linux/packaging/check-package-deps.py "$GITHUB_WORKSPACE" --arch ${{ matrix.arch }}
      - name: Build AppImage
        shell: bash
        env:
          UPDATE_REPO: ${{ github.repository }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          bash linux/packaging/fetch-appimage-tools.sh ${{ matrix.arch }} "$RUNNER_TEMP/appimage"
          VERSION=$(python3 scripts/pubspec_version.py pubspec.yaml)
          export VERSION=${VERSION%%+*}
          APPIMAGETOOL="$RUNNER_TEMP/appimage/appimagetool" \
          RUNTIME_FILE="$RUNNER_TEMP/appimage/runtime" \
          bash linux/packaging/build-appimage.sh "$BUNDLE_DIR" ${{ matrix.arch }} "$GITHUB_WORKSPACE"
      - name: Create tarball
        shell: bash
        run: |
          cd "$BUNDLE_DIR"
          tar -czf "$GITHUB_WORKSPACE/plezy-linux-${{ matrix.arch }}.tar.gz" *
      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: plezy-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: plezy-linux-${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: plezy-linux-${{ matrix.arch }}.rpm
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux pkg.tar.zst
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: plezy-linux-${{ matrix.arch }}.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: plezy-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux AppImage.zsync
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: false
          path: plezy-linux-${{ matrix.arch }}.AppImage.zsync
          if-no-files-found: error
          retention-days: 14
    timeout-minutes: 90

  release:
    name: Publish tagged release
    needs: [build, build-macos, build-android-tv, package-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download app packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: plezy-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Publish release with app downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(
            release-assets/plezy-ios-unsigned.ipa
            release-assets/plezy-tvos-unsigned.ipa
            release-assets/plezy-macos.dmg
            release-assets/plezy-windows-installer.exe
            release-assets/plezy-windows-x64-portable.7z
            release-assets/plezy-windows-arm64-portable.7z
            release-assets/plezy-android-tv-arm64-v8a.apk
            release-assets/plezy-android-tv-armeabi-v7a.apk
            release-assets/plezy-android-tv-x86_64.apk
            release-assets/plezy-linux-x64.tar.gz
            release-assets/plezy-linux-x64.deb
            release-assets/plezy-linux-x64.rpm
            release-assets/plezy-linux-x64.pkg.tar.zst
            release-assets/plezy-linux-x64.AppImage
            release-assets/plezy-linux-x64.AppImage.zsync
            release-assets/plezy-linux-arm64.tar.gz
            release-assets/plezy-linux-arm64.deb
            release-assets/plezy-linux-arm64.rpm
            release-assets/plezy-linux-arm64.pkg.tar.zst
            release-assets/plezy-linux-arm64.AppImage
            release-assets/plezy-linux-arm64.AppImage.zsync
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Missing release package: $asset"
              exit 1
            fi
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false

